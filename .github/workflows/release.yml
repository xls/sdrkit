# Builds the release archives of sdrkit (build.yml) and, for a tag, attaches them to a draft GitHub release.
#
# It runs when a tag v<version> is pushed, and by hand (workflow_dispatch). A run by hand builds and checks the
# archives and keeps them as artifacts of the run; only a pushed tag makes the draft release. The tag must be the
# version of the crate sdrkit-host-ffi: v0.5.0 for version 0.5.0.
#
# For a tag the job `release` also makes the package available to Swift Package Manager by URL: it writes the URL and
# the checksum of SDRKitC-<version>.xcframework.zip into Package.swift at the root, commits that one change on top of
# the tagged commit, and moves the tag to the new commit. The commit is on no branch; the tag keeps its name. The
# notes of the release come from tools/release_notes.sh. Publish the draft by hand: until then the files cannot be
# downloaded, and SwiftPM cannot resolve the version.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check that every file is there
        run: |
          version=${{ needs.build.outputs.version }}
          missing=""
          for p in macos-arm64 macos-x86_64 macos-universal linux-x86_64 linux-arm64 linux-x86 linux-armv7; do
            [ -f "dist/sdrkit-$version-$p.tar.gz" ] || missing="$missing sdrkit-$version-$p.tar.gz"
          done
          for p in windows-x86_64 windows-x86 windows-arm64; do
            [ -f "dist/sdrkit-$version-$p.zip" ] || missing="$missing sdrkit-$version-$p.zip"
          done
          for f in "SDRKitC-$version.xcframework.zip" "SDRKitC-$version.xcframework.zip.checksum"; do
            [ -f "dist/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing"
            exit 1
          fi
      - name: Write the SHA-256 sums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Write the notes
        run: |
          version=${{ needs.build.outputs.version }}
          checksum=$(cat "dist/SDRKitC-$version.xcframework.zip.checksum")
          {
            sh tools/release_notes.sh "$version"
            echo
            echo "## Files"
            echo
            echo "Each archive holds include/, lib/ (static and shared library), lib/cmake/sdrkit/, lib/pkgconfig/,"
            echo "bin/sdrkit, share/sdrkit/data/, LICENSE and THIRD_PARTY.md. SHA256SUMS.txt has the sums."
            echo
            echo "| System | File |"
            echo "|---|---|"
            for p in macos-arm64 macos-x86_64 macos-universal linux-x86_64 linux-arm64 linux-x86 linux-armv7; do
              echo "| $p | \`sdrkit-$version-$p.tar.gz\` |"
            done
            for p in windows-x86_64 windows-x86 windows-arm64; do
              echo "| $p | \`sdrkit-$version-$p.zip\` |"
            done
            echo "| Swift (iOS, macOS, Mac Catalyst) | \`SDRKitC-$version.xcframework.zip\`, checksum \`$checksum\` |"
            echo
            echo "The Linux archives need glibc 2.35 or newer and the ALSA library (libasound2)."
            echo
            echo "Swift Package Manager: \`.package(url: \"https://github.com/$GITHUB_REPOSITORY\", from: \"$version\")\`"
          } > notes.md
          cat notes.md
      - name: Write Package.swift for the release and move the tag to it
        run: |
          version=${{ needs.build.outputs.version }}
          tag="$GITHUB_REF_NAME"
          checksum=$(cat "dist/SDRKitC-$version.xcframework.zip.checksum")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/SDRKitC-$version.xcframework.zip"
          sed -i -E "s|^let releaseURL = \".*\"$|let releaseURL = \"$url\"|; s|^let releaseChecksum = \".*\"$|let releaseChecksum = \"$checksum\"|" Package.swift
          grep -qx "let releaseURL = \"$url\"" Package.swift
          grep -qx "let releaseChecksum = \"$checksum\"" Package.swift
          if command -v swift > /dev/null; then swift package dump-package > /dev/null; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package.swift of sdrkit $version: the XCFramework of the release" Package.swift
          git tag -f -a "$tag" -m "sdrkit $version"
          git push -f origin "refs/tags/$tag"
      - name: Attach the files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/* --draft --verify-tag --title "sdrkit ${{ needs.build.outputs.version }}" \
              --notes-file notes.md
          fi
