[package]
name = "sdrkit-serve-soapyremote"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SoapyRemote server protocol for sdrkit: the RPC calls, UDP and TCP receive and transmit streams, and the SSDP answer"

[dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-serve-core = { path = "../sdrkit-serve-core" }
sdrkit-driver-soapyremote = { path = "../../drivers/sdrkit-driver-soapyremote" }

[dev-dependencies]
# Real sockets for the discovery test on the loopback interface.
sdrkit-core = { path = "../../framework/sdrkit-core", features = ["std-net"] }
sdrkit-driver-core = { path = "../../drivers/sdrkit-driver-core" }
