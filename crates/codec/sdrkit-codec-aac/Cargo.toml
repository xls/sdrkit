[package]
name = "sdrkit-codec-aac"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MPEG-4 AAC for sdrkit: the decoder of AAC-LC, HE-AAC and HE-AAC v2 with 1024- and 960-sample frames, and an AAC-LC encoder of test signals"

[dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-proto-bcdata = { path = "../../proto/sdrkit-proto-bcdata" }
sdrkit-algo-dsp = { path = "../../algo/sdrkit-algo-dsp" }
sdrkit-util-bits = { path = "../../util/sdrkit-util-bits" }

[[bench]]
name = "decode"
harness = false
