[package]
name = "sdrkit-proto-pager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Paging protocols for sdrkit: POCSAG (ITU-R M.584-2 annex 1) and FLEX, from the code word to the page, with voting of repeated copies and encoders"

[dependencies]
sdrkit-util-bits = { path = "../../util/sdrkit-util-bits" }
sdrkit-algo-fec = { path = "../../algo/sdrkit-algo-fec" }
sdrkit-util-text = { path = "../../util/sdrkit-util-text" }

[[test]]
name = "sdrkit-proto-pager"
path = "tests/sdrkit-proto-pager.rs"
