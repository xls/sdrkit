[package]
name = "sdrkit-core"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Types every sdrkit crate shares: samples, settings schemas, results, events"

[dependencies]
sdrkit-macros = { path = "../sdrkit-macros" }
sdrkit-util-geo = { path = "../../util/sdrkit-util-geo", features = ["serde"] }
num-complex.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
socket2 = { version = "0.5", features = ["all"], optional = true }

[features]
# The operating system's network (`net::StdNet`). Hosts turn it on.
std-net = ["dep:socket2"]
