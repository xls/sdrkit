[package]
name = "sdrkit-components"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The standard sdrkit components: thin wrappers over sdrkit-algo-dsp, sdrkit-algo-modem, sdrkit-algo-fec, sdrkit-util-bits and sdrkit-util-ids"

[dependencies]
sdrkit-core = { path = "../sdrkit-core" }
sdrkit-graph = { path = "../sdrkit-graph" }
sdrkit-util-bits = { path = "../../util/sdrkit-util-bits" }
sdrkit-util-ids = { path = "../../util/sdrkit-util-ids" }
sdrkit-algo-dsp = { path = "../../algo/sdrkit-algo-dsp" }
sdrkit-algo-fec = { path = "../../algo/sdrkit-algo-fec" }
sdrkit-algo-modem = { path = "../../algo/sdrkit-algo-modem" }
sdrkit-algo-sim = { path = "../../algo/sdrkit-algo-sim" }
num-complex.workspace = true
