[package]
name = "sdrkit-stack-broadcast"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Digital and stereo broadcast radio: DRM (DRM30 and DRM+), HamDRM, HD Radio (NRSC-5), CDR and AM stereo (C-QUAM)"

[dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-util-bits = { path = "../../util/sdrkit-util-bits" }
sdrkit-util-geo = { path = "../../util/sdrkit-util-geo" }
sdrkit-util-ids = { path = "../../util/sdrkit-util-ids" }
sdrkit-algo-dsp = { path = "../../algo/sdrkit-algo-dsp" }
sdrkit-algo-fec = { path = "../../algo/sdrkit-algo-fec" }
sdrkit-algo-sim = { path = "../../algo/sdrkit-algo-sim" }
sdrkit-algo-modem = { path = "../../algo/sdrkit-algo-modem" }
sdrkit-graph = { path = "../../framework/sdrkit-graph" }
sdrkit-components = { path = "../../framework/sdrkit-components" }
sdrkit-proto-bcdata = { path = "../../proto/sdrkit-proto-bcdata" }
sdrkit-proto-mpegts = { path = "../../proto/sdrkit-proto-mpegts" }
sdrkit-codec-image = { path = "../../codec/sdrkit-codec-image" }
sdrkit-codec-aac = { path = "../../codec/sdrkit-codec-aac" }
serde.workspace = true
