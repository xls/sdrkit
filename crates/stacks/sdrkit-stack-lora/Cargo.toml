[package]
name = "sdrkit-stack-lora"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "LoRa, mesh texting (Meshtastic, MeshCore, MeshCom, LoRa APRS), LoRaWAN and APRS AFSK: receive and transmit"

[dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-util-bits = { path = "../../util/sdrkit-util-bits" }
sdrkit-util-geo = { path = "../../util/sdrkit-util-geo" }
sdrkit-util-ids = { path = "../../util/sdrkit-util-ids" }
sdrkit-algo-dsp = { path = "../../algo/sdrkit-algo-dsp" }
sdrkit-algo-sim = { path = "../../algo/sdrkit-algo-sim" }
sdrkit-algo-crypto = { path = "../../algo/sdrkit-algo-crypto" }
sdrkit-graph = { path = "../../framework/sdrkit-graph" }
sdrkit-components = { path = "../../framework/sdrkit-components" }
sdrkit-proto-lora-phy = { path = "../../proto/sdrkit-proto-lora-phy" }
sdrkit-proto-meshtastic = { path = "../../proto/sdrkit-proto-meshtastic" }
sdrkit-proto-link = { path = "../../proto/sdrkit-proto-link" }
sdrkit-util-objects = { path = "../../util/sdrkit-util-objects" }
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
# Fresh identity keys and packet ids come from the operating system (MIT OR Apache-2.0).
getrandom = "0.2"

[dev-dependencies]
sdrkit-data-plans = { path = "../../data/sdrkit-data-plans" }
# The reader of the data folder: the tests set the values of its rows.
sdrkit-presets = { path = "../../helpers/sdrkit-presets" }
sdrkit-dev-test = { path = "../../dev/sdrkit-dev-test" }
sdrkit-dev-interface = { path = "../../dev/sdrkit-dev-interface" }
