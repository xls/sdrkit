[package]
name = "sdrkit-stack-adsb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ADS-B and Mode S on 1090 MHz, Mode A/C replies, Mode S interrogations on 1030 MHz, UAT and FIS-B on 978 MHz, with Beast, SBS and ASTERIX feeds"

[dependencies]
