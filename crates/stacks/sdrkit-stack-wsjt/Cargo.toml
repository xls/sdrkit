[package]
name = "sdrkit-stack-wsjt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Weak-signal digital stacks: FT8, FT4, FST4, FST4W, FT2, JT4, JT9, JT65, Q65, MSK144, WSPR and JS8, with encoders"

[dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-util-bits = { path = "../../util/sdrkit-util-bits" }
sdrkit-util-geo = { path = "../../util/sdrkit-util-geo" }
sdrkit-util-text = { path = "../../util/sdrkit-util-text" }
sdrkit-algo-dsp = { path = "../../algo/sdrkit-algo-dsp" }
sdrkit-algo-fec = { path = "../../algo/sdrkit-algo-fec" }
sdrkit-algo-sim = { path = "../../algo/sdrkit-algo-sim" }
sdrkit-algo-modem = { path = "../../algo/sdrkit-algo-modem" }
sdrkit-graph = { path = "../../framework/sdrkit-graph" }
sdrkit-components = { path = "../../framework/sdrkit-components" }
sdrkit-util-objects = { path = "../../util/sdrkit-util-objects" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
num-complex.workspace = true

[dev-dependencies]
sdrkit-dev-test = { path = "../../dev/sdrkit-dev-test" }
sdrkit-dev-interface = { path = "../../dev/sdrkit-dev-interface" }
# The dials and band edges of the data folder, for the tests.
sdrkit-presets = { path = "../../helpers/sdrkit-presets" }
# The engine and the fake iiod radio, for the start time of a call on air.
sdrkit-host-engine = { path = "../../hosts/sdrkit-host-engine" }
sdrkit-driver-core = { path = "../../drivers/sdrkit-driver-core", features = ["fake"] }
