[package]
name = "sdrkit-data-plans"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Band and channel plans read from plan files that the host loads, with a published schema; the host picks a plan by its id. Holds the tables of the cellular bands and the DAB blocks"

[dependencies]
sdrkit-util-text = { path = "../../util/sdrkit-util-text" }
sdrkit-core = { path = "../../framework/sdrkit-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The JSON path of a refused value in a plan file: MIT OR Apache-2.0.
serde_path_to_error = "0.1"

[dev-dependencies]
sdrkit-dev-test = { path = "../../dev/sdrkit-dev-test" }
