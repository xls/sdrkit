[package]
name = "sdrkit-algo-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin wrappers over RustCrypto and dalek for keys the user supplies: AES (ECB, CTR, CCM, GCM, CMAC), DES, SHA-256, SHA-1, HMAC-SHA256, X25519 and Ed25519"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "zeroize"] }
ccm = { version = "0.5", default-features = false }
cmac = "0.7"
ctr = "0.9"
des = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
hmac = { version = "0.12", features = ["reset"] }
sha2 = "0.10"
sha1 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
zeroize = "1"
subtle = { version = "2", default-features = false }
