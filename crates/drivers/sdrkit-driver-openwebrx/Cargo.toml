[package]
name = "sdrkit-driver-openwebrx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenWebRX client driver for sdrkit: the audio and the waterfall of a web receiver over a WebSocket"

[dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-driver-core = { path = "../sdrkit-driver-core", features = ["tls"] }
sdrkit-graph = { path = "../../framework/sdrkit-graph" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true

[dev-dependencies]
# The TLS side of the fake server and the test certificate (Apache-2.0 / ISC / MIT).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
