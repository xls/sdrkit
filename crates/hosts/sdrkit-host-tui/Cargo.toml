[package]
name = "sdrkit-host-tui"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A terminal application on the sdrkit C API: stacks, radios, sessions, settings, events, commands and services"

[[bin]]
name = "sdrkit-tui"
path = "src/main.rs"

[dependencies]
# Links the symbols of the C API, with its presets part. The application calls them through the declarations in
# `sys.rs` only.
sdrkit-host-ffi = { path = "../sdrkit-host-ffi", features = ["presets"] }
# The data folder: the preset of a stack and the known stations of a country.
sdrkit-presets = { path = "../../helpers/sdrkit-presets" }
# Command line parsing: MIT OR Apache-2.0.
clap = { version = "4", features = ["derive", "wrap_help"] }
# Sound output: Apache-2.0.
cpal = "0.15"
# The offset of local time from UTC: MIT OR Apache-2.0.
libc = "0.2"
# Restores the terminal when a signal ends the application: MIT OR Apache-2.0.
ctrlc = { version = "3", features = ["termination"] }
# The terminal screen: MIT.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
