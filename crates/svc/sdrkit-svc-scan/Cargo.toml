[package]
name = "sdrkit-svc-scan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Activity scans of lists, memories and bands, channel scans judged by the lock profile of a stack, span-block scans and two-stage surveys judged by a result of the stack, as an sdrkit owner"

[dependencies]
