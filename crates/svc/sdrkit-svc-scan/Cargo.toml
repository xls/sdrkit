sdrkit-algo-modem = { path = "../../algo/sdrkit-algo-modem" }
sdrkit-util-text = { path = "../../util/sdrkit-util-text" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
sdrkit-algo-sim = { path = "../../algo/sdrkit-algo-sim" }
serde_json.workspace = true
# The test signal of the general stack, through the impairments of the test radio.
sdrkit-stack-general = { path = "../../stacks/sdrkit-stack-general" }
sdrkit-components = { path = "../../framework/sdrkit-components" }
sdrkit-driver-core = { path = "../../drivers/sdrkit-driver-core" }
