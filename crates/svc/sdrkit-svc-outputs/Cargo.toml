[package]
name = "sdrkit-svc-outputs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Feeds of sdrkit events to other programs: MQTT with discovery, webhooks, JSON lines to files, UDP and TCP, AIS NMEA, KISS, APRS-IS gating, SBS and spot reports"

[dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-svc-events = { path = "../sdrkit-svc-events" }
sdrkit-util-geo = { path = "../../util/sdrkit-util-geo" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
sdrkit-core = { path = "../../framework/sdrkit-core", features = ["std-net"] }
