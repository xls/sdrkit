[package]
name = "sdrkit-svc-store"
version = "0.5.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The searchable message store of sdrkit: records of every event, full-text search, retention, daily files, exports and the session book (tracks, pager threads, conversations)"

[dependencies]
sdrkit-util-text = { path = "../../util/sdrkit-util-text" }
sdrkit-core = { path = "../../framework/sdrkit-core" }
sdrkit-svc-events = { path = "../sdrkit-svc-events" }
sdrkit-util-geo = { path = "../../util/sdrkit-util-geo" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
